name: docboo-frontend

# Production-like build of the SPA served by nginx.
# Requires the docboo-backend API listening on the host (Docker or native), port 5248 by default.
services:
  web:
    build:
      context: .
      target: final
    restart: unless-stopped
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-http://host.docker.internal:5248}
    extra_hosts:
      # Makes host.docker.internal resolve on Linux engines too (Docker Desktop already provides it).
      - "host.docker.internal:host-gateway"
    ports:
      - "${WEB_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 5
