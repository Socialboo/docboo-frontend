# Hot-reload override:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# web -> Vite dev server on :3000, proxying /api to the API on the Docker host.
services:
  web:
    build:
      target: dev
    environment:
      VITE_API_PROXY_TARGET: ${API_UPSTREAM:-http://host.docker.internal:5248}
      VITE_USE_POLLING: "1"
    volumes:
      - .:/app
      # Keep the Linux node_modules from the image; never use the host's.
      - web-node-modules:/app/node_modules
    ports: !override
      - "${WEB_DEV_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      start_period: 60s

volumes:
  web-node-modules:
